
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتائج الباكالوريا 2019</title>
    <style>
        body {
            font-family: 'Helvetica World', sans-serif;
            background-color: #f8f9fa;
            text-align: center;
            padding: 20px;
            direction: rtl;
        }
        h1 {
            color: #2c3e50;
        }
        select, input {
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        table {
            margin: auto;
            margin-top: 30px;
            border-collapse: collapse;
            width: 90%;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .filters {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>نتائج الباكالوريا 2019</h1>

    <div>
        <input type="text" id="searchInput" placeholder="أدخل رقم الجلوس الكامل">
        <button onclick="search()">بحث</button>
    </div>

    <div class="filters">
        <select id="wilayaSelect" onchange="filterByWilaya()">
            <option value="">اختر الولاية</option>
        </select>
        <select id="moughataaSelect" onchange="filterByMoughataa()">
            <option value="">اختر المقاطعة</option>
        </select>
        <select id="schoolSelect" onchange="filterBySchool()">
            <option value="">اختر المدرسة</option>
        </select>
        <select id="centerSelect" onchange="filterByCenter()">
            <option value="">اختر المركز</option>
        </select>
    </div>

    <div id="resultsTable"></div>

    <script>
        let allResults = [];
        let top10Results = [];

        async function loadTop10() {
            const res = await fetch("top10.json");
            top10Results = await res.json();
            displayResults(top10Results);
        }

        function displayResults(results) {
            if (results.length === 0) {
                document.getElementById("resultsTable").innerHTML = "<p>لا توجد نتائج</p>";
                return;
            }
            let html = "<table><thead><tr><th>الاسم</th><th>رقم الجلوس</th><th>المعدل</th><th>الولاية</th><th>المدرسة</th><th>المركز</th></tr></thead><tbody>";
            results.forEach(r => {
                html += `<tr>
                    <td>${r.nom}</td>
                    <td>${r.numero}</td>
                    <td>${r.moyenne}</td>
                    <td>${r.wilaya || ''}</td>
                    <td>${r.ecole || ''}</td>
                    <td>${r.centre || ''}</td>
                </tr>`;
            });
            html += "</tbody></table>";
            document.getElementById("resultsTable").innerHTML = html;
        }

        async function search() {
            const numero = document.getElementById("searchInput").value.trim();
            if (numero.length === 0) return;
            const partIndex = getPartIndex(numero);
            const res = await fetch(`results_part${partIndex}.json`);
            const results = await res.json();
            const found = results.find(r => r.numero == numero);
            displayResults(found ? [found] : []);
        }

        function getPartIndex(numero) {
            const num = parseInt(numero);
            if (num < 3000) return 1;
            else if (num < 6000) return 2;
            else if (num < 9000) return 3;
            else return 4;
        }

        function populateFilters(data) {
            const wilayas = [...new Set(data.map(r => r.wilaya))].filter(Boolean);
            const wilayaSelect = document.getElementById("wilayaSelect");
            wilayas.forEach(w => {
                const option = document.createElement("option");
                option.value = w;
                option.textContent = w;
                wilayaSelect.appendChild(option);
            });
        }

        async function filterByWilaya() {
            const wilaya = document.getElementById("wilayaSelect").value;
            const filtered = top10Results.filter(r => r.wilaya === wilaya);
            displayResults(filtered);
        }

        async function filterByMoughataa() {
            const moughataa = document.getElementById("moughataaSelect").value;
            const filtered = top10Results.filter(r => r.moughataa === moughataa);
            displayResults(filtered);
        }

        async function filterBySchool() {
            const ecole = document.getElementById("schoolSelect").value;
            const files = ["results_part1.json", "results_part2.json", "results_part3.json", "results_part4.json"];
            let all = [];
            for (const file of files) {
                const res = await fetch(file);
                const data = await res.json();
                all.push(...data.filter(r => r.ecole === ecole));
            }
            displayResults(all);
        }

        async function filterByCenter() {
            const center = document.getElementById("centerSelect").value;
            const files = ["results_part1.json", "results_part2.json", "results_part3.json", "results_part4.json"];
            let all = [];
            for (const file of files) {
                const res = await fetch(file);
                const data = await res.json();
                all.push(...data.filter(r => r.centre === center));
            }
            displayResults(all);
        }

        // تحميل أولي
        window.onload = async () => {
            await loadTop10();
            populateFilters(top10Results);
        };
    </script>
</body>
</html>
