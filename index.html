
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Natija.mr - النتائج الوطنية</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
      text-align: center;
      direction: rtl;
    }
    header {
      background-color: #2c3e50;
      padding: 20px;
      color: white;
    }
    h1 {
      margin: 0;
      font-size: 28px;
    }
    .menu {
      margin: 30px auto;
    }
    .menu button {
      padding: 15px 25px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      transition: background-color 0.3s ease;
    }
    .menu button:hover {
      background-color: #2980b9;
    }
    #message {
      margin-top: 20px;
      color: red;
      font-weight: bold;
    }
    #searchSection {
      margin: 20px;
    }
    #searchSection input[type="search"],
    #searchSection select {
      padding: 10px;
      margin: 10px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #searchBtn {
      padding: 10px 20px;
      background-color: #27ae60;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    table {
      width: 90%;
      margin: 0 auto 40px auto;
      border-collapse: collapse;
      display: none;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ccc;
    }
    th {
      background-color: #2980b9;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <header>
    <h1>نتائج الامتحانات الوطنية في موريتانيا</h1>
  </header>

  <div class="menu">
    <button onclick="loadResults('bac')">نتائج الباكالوريا</button>
    <button onclick="alert('📌 سيتم إضافة نتائج الإعدادية قريبًا')">نتائج الإعدادية</button>
    <button onclick="alert('📌 سيتم إضافة نتائج الابتدائية قريبًا')">نتائج الابتدائية</button>
  </div>

  <div id="searchSection" style="display:none;">
    <input type="search" id="searchInput" placeholder="رقم الجلوس الكامل فقط">
    <button id="searchBtn" onclick="filterByNumber()">بحث</button>
    <br/>
    <select id="wilayaSelect" onchange="filterByCategory()">
      <option value="">-- اختر الولاية --</option>
    </select>
    <select id="moughataaSelect" onchange="filterByCategory()">
      <option value="">-- اختر المقاطعة --</option>
    </select>
    <select id="schoolSelect" onchange="filterByCategory()">
      <option value="">-- اختر المدرسة --</option>
    </select>
    <select id="centerSelect" onchange="filterByCategory()">
      <option value="">-- اختر المركز --</option>
    </select>
  </div>

  <div id="message"></div>

  <table id="resultsTable">
    <thead>
      <tr>
        <th>رقم التسجيل</th>
        <th>الاسم الكامل</th>
        <th>الشعبة</th>
        <th>المعدل</th>
        <th>النتيجة</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    let allResults = [];
    let partsLoaded = false;
    let fullDataLoaded = false;

    function loadResults(type) {
      if (type !== 'bac') return;

      document.getElementById("searchSection").style.display = "block";
      document.getElementById("resultsTable").style.display = "table";
      document.getElementById("message").textContent = "📊 جاري تحميل العشرة الأوائل...";

      fetch("top10.json")
        .then(res => res.json())
        .then(data => {
          allResults = data;
          renderResults(data);
          document.getElementById("message").textContent = "✅ تم تحميل العشرة الأوائل فقط.";
        })
        .catch(err => {
          document.getElementById("message").textContent = "⚠️ فشل تحميل العشرة الأوائل";
        });

      // تحميل بيانات التصنيف (ولاية، مقاطعة، مدرسة، مركز)
      if (!fullDataLoaded) {
        Promise.all([
          fetch("bac_part1.json").then(res => res.json()),
          fetch("bac_part2.json").then(res => res.json()),
          fetch("bac_part3.json").then(res => res.json()),
          fetch("bac_part4.json").then(res => res.json())
        ])
        .then(parts => {
          allResults = allResults.concat(...parts);
          fullDataLoaded = true;
          populateFilters();
        })
        .catch(err => {
          console.error("فشل تحميل البيانات الكاملة:", err);
        });
      }
    }

    function renderResults(data) {
      const tbody = document.querySelector("#resultsTable tbody");
      tbody.innerHTML = "";
      data.forEach(item => {
        const row = `<tr>
          <td>${item.num}</td>
          <td>${item.name}</td>
          <td>${item.serie}</td>
          <td>${item.moyenne}</td>
          <td>${item.decision}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function filterByNumber() {
      const input = document.getElementById("searchInput").value.trim();
      if (input.length < 4) {
        document.getElementById("message").textContent = "📛 أدخل رقم جلوس صحيح وكامل";
        return;
      }
      const match = allResults.find(r => String(r.num) === input);
      if (match) {
        renderResults([match]);
        document.getElementById("message").textContent = "✅ تم العثور على النتيجة.";
      } else {
        document.getElementById("message").textContent = "❌ لم يتم العثور على النتيجة.";
        renderResults([]);
      }
    }

    function populateFilters() {
      const wilayaSet = new Set();
      const moughataaSet = new Set();
      const schoolSet = new Set();
      const centerSet = new Set();

      allResults.forEach(r => {
        if (r.wilaya) wilayaSet.add(r.wilaya);
        if (r.moughataa) moughataaSet.add(r.moughataa);
        if (r.school) schoolSet.add(r.school);
        if (r.centre) centerSet.add(r.centre);
      });

      populateSelect("wilayaSelect", wilayaSet);
      populateSelect("moughataaSelect", moughataaSet);
      populateSelect("schoolSelect", schoolSet);
      populateSelect("centerSelect", centerSet);
    }

    function populateSelect(selectId, items) {
      const select = document.getElementById(selectId);
      items = Array.from(items).sort();
      items.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function filterByCategory() {
      const wilaya = document.getElementById("wilayaSelect").value;
      const moughataa = document.getElementById("moughataaSelect").value;
      const school = document.getElementById("schoolSelect").value;
      const centre = document.getElementById("centerSelect").value;

      const filtered = allResults.filter(r =>
        (!wilaya || r.wilaya === wilaya) &&
        (!moughataa || r.moughataa === moughataa) &&
        (!school || r.school === school) &&
        (!centre || r.centre === centre)
      );
      renderResults(filtered);
      document.getElementById("message").textContent = `🔎 تم العثور على ${filtered.length} نتيجة.`;
    }
  </script>

</body>
</html>
