
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Natija.mr - النتائج الوطنية</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
      text-align: center;
      direction: rtl;
    }
    header {
      background-color: #2c3e50;
      padding: 20px;
      color: white;
    }
    h1 {
      margin: 0;
      font-size: 28px;
    }
    .menu {
      margin: 30px auto;
    }
    .menu button {
      padding: 15px 25px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      transition: background-color 0.3s ease;
    }
    .menu button:hover {
      background-color: #2980b9;
    }
    #message {
      margin-top: 20px;
      color: red;
      font-weight: bold;
    }
    input[type="search"] {
      padding: 10px;
      margin: 20px auto;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: none;
    }
    table {
      width: 90%;
      margin: 0 auto 40px auto;
      border-collapse: collapse;
      display: none;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ccc;
    }
    th {
      background-color: #2980b9;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <header>
    <h1>نتائج الامتحانات الوطنية في موريتانيا</h1>
  </header>

  <div class="menu">
    <button onclick="loadResults('bac')">نتائج الباكالوريا</button>
    <button onclick="alert('📌 سيتم إضافة نتائج الإعدادية قريبًا')">نتائج الإعدادية</button>
    <button onclick="alert('📌 سيتم إضافة نتائج الابتدائية قريبًا')">نتائج الابتدائية</button>
  </div>

  <input type="search" id="searchInput" placeholder="ابحث بالاسم أو رقم التسجيل..." onkeyup="filterResults()">
  <div id="message"></div>

  <table id="resultsTable">
    <thead>
      <tr>
        <th>رقم التسجيل</th>
        <th>الاسم الكامل</th>
        <th>الشعبة</th>
        <th>المعدل</th>
        <th>النتيجة</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    let allResults = [];
    let partsLoaded = false;

    function loadResults(type) {
      if (type !== 'bac') return;

      document.getElementById("searchInput").style.display = "block";
      document.getElementById("resultsTable").style.display = "table";
      document.getElementById("message").textContent = "📊 جاري تحميل العشرة الأوائل...";

      fetch("top10.json")
        .then(res => res.json())
        .then(data => {
          allResults = data;
          renderResults(data);
          document.getElementById("message").textContent = "✅ تم تحميل العشرة الأوائل فقط. للبحث أدخل رقم الجلوس.";
        })
        .catch(err => {
          document.getElementById("message").textContent = "⚠️ فشل تحميل العشرة الأوائل";
        });
    }

    function filterResults() {
      const query = document.getElementById("searchInput").value.toLowerCase().replace(/\s/g, '');

      if (!partsLoaded) {
        document.getElementById("message").textContent = "⏳ تحميل جميع النتائج للبحث...";
        Promise.all([
          fetch("bac_part1.json").then(res => res.json()),
          fetch("bac_part2.json").then(res => res.json()),
          fetch("bac_part3.json").then(res => res.json()),
          fetch("bac_part4.json").then(res => res.json())
        ])
        .then(parts => {
          allResults = allResults.concat(...parts);
          partsLoaded = true;
          document.getElementById("message").textContent = "✅ تم تحميل جميع النتائج.";
          renderResults(allResults.filter(item =>
            item.name.toLowerCase().includes(query) ||
            String(item.num).includes(query)
          ));
        })
        .catch(err => {
          document.getElementById("message").textContent = "⚠️ فشل تحميل بقية النتائج";
        });
      } else {
        const filtered = allResults.filter(item =>
          item.name.toLowerCase().includes(query) ||
          String(item.num).includes(query)
        );
        renderResults(filtered);
      }
    }

    function renderResults(data) {
      const tbody = document.querySelector("#resultsTable tbody");
      tbody.innerHTML = "";
      data.forEach(item => {
        const row = `<tr>
          <td>${item.num}</td>
          <td>${item.name}</td>
          <td>${item.serie}</td>
          <td>${item.moyenne}</td>
          <td>${item.decision}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }
  </script>

</body>
</html>
