  <table id="resultsTable" style="display: none;">
    <thead>
      <tr>
        <th>رقم الجلوس</th>
        <th>الاسم</th>
        <th>المعدل</th>
        <th>القرار</th>
        <th>الولاية</th>
        <th>المركز</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>

  <script>
    let allData = [];

    async function fetchData() {{
      const parts = [1,2,3,4];
      const promises = parts.map(p => fetch(`bac_part${p}.json`).then(res => res.json()));
      const results = await Promise.all(promises);
      allData = results.flat();
    }}

    function renderTable(data) {{
      const table = document.getElementById("resultsTable");
      const body = document.getElementById("resultsBody");
      body.innerHTML = "";
      data.forEach(row => {{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${{row["numéro bac"]}}</td>
          <td>${{row["nom"]}}</td>
          <td>${{row["moyenne"]}}</td>
          <td>${{row["decision"]}}</td>
          <td>${{row["wilaya"]}}</td>
          <td>${{row["centre"]}}</td>
        `;
        body.appendChild(tr);
      }});
      table.style.display = data.length ? "table" : "none";
    }}

    function searchResult() {{
      const num = document.getElementById("numInput").value.trim();
      if (num.length < 5) return alert("يرجى إدخال رقم جلوس كامل.");
      const results = allData.filter(r => r["numéro bac"] === num);
      renderTable(results);
    }}

    function filterResults() {{
      const wilaya = document.getElementById("wilayaSelect").value;
      const centre = document.getElementById("centreSelect").value;
      let filtered = allData;
      if (wilaya) filtered = filtered.filter(r => r["wilaya"] === wilaya);
      if (centre) filtered = filtered.filter(r => r["centre"] === centre);
      renderTable(filtered);
    }}

    window.onload = fetchData;
  </script>
